spring.application.name=autoloc-api
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Hibernate / JPA
# ddl-auto strategies:
# create      : drops and recreates all tables every time the app starts (data lost at each run)
# create-drop : same as create, but also drops the tables when the app stops (useful for tests)
# update      : creates missing tables/columns and keeps existing data (does not remove columns or change types)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO